name: Docker Build and Upload

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches: [ master ]
  pull_request:
  schedule:
    # once a week
    - cron:  '0 0 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        # Required only for the multi-arch container builds that are pushed to Dockerhub.
        # Setting up QEMU during normal PRs prevents testing of the container included
        # QEMU setup.
        if: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags') }}
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            mkaczanowski/packer-plugin-builder-arm
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=match,pattern=v(.*),group=1

      #### build+export, test only on PRs
      - name: Build and export to Docker
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: packer-plugin-builder-arm:test
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install packer plugins
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm --privileged -v ${PWD}:/build packer-plugin-builder-arm:test init boards/raspberry-pi-4/archlinuxarm.pkr.hcl

      - name: Test build board
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm --privileged -v ${PWD}:/build packer-plugin-builder-arm:test build boards/raspberry-pi-4/archlinuxarm.pkr.hcl -extra-system-packages=bmap-tools,zstd
          du -h raspberry-pi-4.img
          du -h --apparent-size raspberry-pi-4.img
      ####

      - name: Login to DockerHub
        uses: docker/login-action@v4
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags')
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # - name: Login to GitHub Container Registry
      #   uses: docker/login-action@v4
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.repository_owner }}
      #     password: ${{ secrets.GHCR_IO_REGISTRY_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        if: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags') }}
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Disabled: fails with "Forbidden" on the PATCH to hub.docker.com.
      # Debugged 2026-09-18: the 403 is returned by the Cloudflare WAF in
      # front of the Docker Hub v2 API, not by Docker Hub itself
      # (see https://github.com/peter-evans/dockerhub-description/issues/331).
      # The exact same PATCH with the full README payload returns a clean
      # 401 from Docker Hub auth when sent from a non-CI IP, so it is not
      # the README content, the user-agent or the token - the block is
      # tied to GitHub-hosted runner egress IPs, which the WAF scores
      # poorly. No reliable content-based workaround; updating the Hub
      # description manually instead.
